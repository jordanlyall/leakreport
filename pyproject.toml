[project]
name = "leakreport"
version = "0.1.0"
description = "NFT wallet leak report for one Ethereum wallet (read-only)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow>=10.3",
    "python-dotenv>=1.0",
]

[project.scripts]
leak = "cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["ledger", "sources", "leaks", "card", "score.py", "report.py", "cli.py"]

[tool.hatch.build]
dev-mode-dirs = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
